name: Test Build

# The original Build App workflow hardcodes `ref: master` and requires signing
# secrets for release builds, so it cannot build a feature branch as-is.
# This lightweight workflow builds whatever is pushed to `testbuild` as a
# release APK, signed with a keystore kept in the KEYSTORE secret.
on:
  push:
    branches:
      - testbuild
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Signs both debug and release builds with a stable key through the project's own
      # signing.gradle (signing.properties). The AGP debug keystore location is not used
      # because it follows XDG_CONFIG_HOME on newer runners (~/.config/.android) and would
      # differ from what the workflow would otherwise create (~/.android).
      # On the first run (secret not set yet) a keystore is generated and uploaded as the
      # `debug-keystore-base64` artifact, to be saved as the KEYSTORE secret.
      - name: Restore or create signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            echo "Restored keystore from the KEYSTORE secret"
            echo "generated=false" >> $GITHUB_OUTPUT
          else
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w 0 keystore.jks > keystore.b64
            echo "generated=true" >> $GITHUB_OUTPUT
            echo "::notice::KEYSTORE secret is not set. Save the debug-keystore-base64 artifact as the KEYSTORE secret to get a stable signature."
          fi

          # signing.gradle resolves KEYSTORE_FILE against the :manager project directory,
          # so ../keystore.jks points at the repository root.
          {
            echo "KEYSTORE_FILE=../keystore.jks"
            echo "KEYSTORE_PASSWORD=android"
            echo "KEYSTORE_ALIAS=androiddebugkey"
            echo "KEYSTORE_ALIAS_PASSWORD=android"
          } > signing.properties

      - name: Upload generated keystore
        if: ${{ steps.keystore.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: debug-keystore-base64
          path: keystore.b64
          if-no-files-found: error

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ./gradlew :manager:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: shizuku-release
          path: manager/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # R8 renames classes, so this mapping file is required to symbolicate
      # crash reports from the release build.
      - name: Upload mapping
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: mapping
          path: manager/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
