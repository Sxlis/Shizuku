name: Build App

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug'
        type: boolean
        required: false
        default: false

      prerelease:
        description: 'Prerelease'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    outputs:
      versionName: ${{ steps.buildWithGradle.outputs.versionName }}
      artifactName: ${{ steps.buildWithGradle.outputs.artifactName }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Signs every build with the keystore stored in the KEYSTORE secret so that
      # builds can be installed over the previous one. When the secret is missing a
      # throwaway keystore is generated: the build still succeeds, but the resulting
      # APK cannot update installs made with a different key.
      - name: Restore or create signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            echo "Restored keystore from the KEYSTORE secret"
          else
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::KEYSTORE secret is not set. Generated a throwaway keystore, this build will not update previous installs."
          fi

          # signing.gradle resolves KEYSTORE_FILE against the :manager project
          # directory, so ../keystore.jks points at the repository root.
          {
            echo "KEYSTORE_FILE=../keystore.jks"
            echo "KEYSTORE_PASSWORD=android"
            echo "KEYSTORE_ALIAS=androiddebugkey"
            echo "KEYSTORE_ALIAS_PASSWORD=android"
          } > signing.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        id: buildWithGradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties

          if [ "${{ inputs.debug }}" = "true" ]; then
            CMD="./gradlew :manager:assembleDebug"
            APK_DIR="manager/build/outputs/apk/debug"
          else
            CMD="./gradlew :manager:assembleRelease"
            APK_DIR="manager/build/outputs/apk/release"
          fi

          [ "${{ inputs.prerelease }}" = "true" ] && CMD="$CMD -Pbeta"

          eval $CMD
          FILE=$(ls "$APK_DIR"/*.apk)

          VERSION=$(echo "$(basename "$FILE")" | sed -E 's/^shizuku-(.*)-(debug|release)\.apk/\1/')

          ARTIFACT_NAME="shizuku-$VERSION"
          [ "${{ inputs.debug }}" = "true" ] && ARTIFACT_NAME="${ARTIFACT_NAME}-debug"
          ARTIFACT_NAME="${ARTIFACT_NAME}.apk"

          RENAMED="$FILE"
          if [ "$(basename "$FILE")" != "$ARTIFACT_NAME" ]; then
            RENAMED="$(dirname "$FILE")/$ARTIFACT_NAME"
            mv "$FILE" "$RENAMED"
          fi

          echo "versionName=$VERSION" >> $GITHUB_OUTPUT
          echo "artifactName=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "filePath=$RENAMED" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.buildWithGradle.outputs.artifactName }}
          path: ${{ steps.buildWithGradle.outputs.filePath }}

      # R8 renames classes, so this mapping file is required to symbolicate
      # crash reports from the release build.
      - name: Upload mapping
        if: ${{ always() && !inputs.debug }}
        uses: actions/upload-artifact@v6
        with:
          name: mapping
          path: manager/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Attest Build Provenance
        if: ${{ success() && !inputs.debug }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: manager/build/outputs/apk/release/*.apk

  release:
    if: ${{ !inputs.debug }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Release Tag
        run: |
          VERSION="${{ needs.build.outputs.versionName }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" > /dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
          else
            git tag "$VERSION" -m "Release version $VERSION"
            git push origin "$VERSION"
          fi

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifactName }}
          path: files

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.versionName }}
        run: |
          FLAGS="--draft"
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease"
          if gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists, uploading assets"
            gh release upload "$RELEASE_VERSION" files/*.apk --clobber
          else
            gh release create "$RELEASE_VERSION" files/*.apk $FLAGS
          fi
